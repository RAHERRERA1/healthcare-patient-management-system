name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Run verification
        run: ./mvnw clean verify

      - name: Upload application jar
        uses: actions/upload-artifact@v4
        with:
          name: healthcare-api-jar
          path: target/*.jar

      - name: Build Docker image
        run: docker build -t healthcare-api:ci .

      - name: Run Docker container
        run: docker run -d --name healthcare-api -p 8080:8080 -e SPRING_PROFILES_ACTIVE=test healthcare-api:ci

      - name: Wait for API health
        run: |
          for i in {1..30}; do
            if curl -f http://localhost:8080/actuator/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs healthcare-api
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker stop healthcare-api
